[versions]
# Pinned deliberately, every one an exact version, and kept the same as the template app's
# release 0.0.2 (see the CheckLink spec, sections 5 and 7), so both apps move together. A
# bump is a deliberate, reviewed act: check the release is at least 14 days old.
agp = "9.3.1"            # AGP 9.3.x: Gradle 9.5.0, JDK 17 minimum, built-in Kotlin 2.2.10
activity = "1.13.0"      # the release the template app and UsernameGenerator ship
coreKtx = "1.19.0"       # the release the template app and UsernameGenerator ship
webkit = "1.17.0"        # 2026-08-12, as the template app. 1.17.1 (2026-09-23) passed the 14-day rule
                         # on 2026-10-07; left for the next dependency review of both apps
junit = "4.13.2"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
